map_hash_bucket_size 128;
include /etc/nginx/snippets/cloudflare-realip.conf;

map $http_x_api_key $api_key_ok_develop {
    default 0;
    include /etc/nginx/snippets/milanko-api-keys-develop.conf;
}
map $http_x_api_key $api_key_ok_qa {
    default 0;
    include /etc/nginx/snippets/milanko-api-keys-qa.conf;
}
map $http_x_api_key $api_key_ok_production {
    default 0;
    include /etc/nginx/snippets/milanko-api-keys-production.conf;
}

map $request_method $is_options {
    default 0;
    OPTIONS 1;
}
map "$is_options:$api_key_ok_develop" $api_deny_develop {
    default 0;
    "0:0" 1;
}
map "$is_options:$api_key_ok_qa" $api_deny_qa {
    default 0;
    "0:0" 1;
}
map "$is_options:$api_key_ok_production" $api_deny_production {
    default 0;
    "0:0" 1;
}

limit_req_zone $binary_remote_addr zone=milanko_api_ip:10m rate=20r/s;
limit_req_zone $http_x_api_key zone=milanko_api_key:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=milanko_api_conn:10m;
limit_req_status 429;
limit_conn_status 429;
