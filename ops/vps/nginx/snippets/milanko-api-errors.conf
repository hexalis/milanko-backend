error_page 401 = @api_unauthorized;
error_page 429 = @api_ratelimited;

location @api_unauthorized {
    default_type application/json;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "X-API-Key, Content-Type" always;
    add_header Cache-Control "no-store" always;
    return 401 '{"detail":"Invalid or missing API key"}';
}

location @api_ratelimited {
    default_type application/json;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "X-API-Key, Content-Type" always;
    add_header Cache-Control "no-store" always;
    return 429 '{"detail":"Rate limit exceeded"}';
}
