# Catch-all HTTP: reject unknown Host headers.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# HTTP: ACME challenge + redirect to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name dev-milanko.hexalis.org qa-milanko.hexalis.org milanko.hexalis.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- DEVELOP ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dev-milanko.hexalis.org;

    root /srv/milanko/landing/develop;
    index index.html;
    client_max_body_size 10m;
    error_page 404 /404.html;

    ssl_certificate /etc/letsencrypt/live/milanko.hexalis.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/milanko.hexalis.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    include /etc/nginx/snippets/milanko-api-errors.conf;

    location = /api/v1 {
        return 302 /api/v1/docs;
    }
    location = /api {
        return 302 /api/v1/docs;
    }

    location = /api/v1/health {
        proxy_pass http://127.0.0.1:8011/health;
        include /etc/nginx/snippets/milanko-api-proxy.conf;
    }
    location = /api/v1/docs {
        proxy_pass http://127.0.0.1:8011/docs;
        include /etc/nginx/snippets/milanko-api-proxy.conf;
    }
    location = /api/v1/redoc {
        proxy_pass http://127.0.0.1:8011/redoc;
        include /etc/nginx/snippets/milanko-api-proxy.conf;
    }
    location = /api/v1/openapi.json {
        proxy_pass http://127.0.0.1:8011/openapi.json;
        include /etc/nginx/snippets/milanko-api-proxy.conf;
    }
    location = /api/health {
        proxy_pass http://127.0.0.1:8011/health;
        include /etc/nginx/snippets/milanko-api-proxy.conf;
    }
    location = /api/docs {
        proxy_pass http://127.0.0.1:8011/docs;
        include /etc/nginx/snippets/milanko-api-proxy.conf;
    }
    location = /api/openapi.json {
        proxy_pass http://127.0.0.1:8011/openapi.json;
        include /etc/nginx/snippets/milanko-api-proxy.conf;
    }

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8011/;
        include /etc/nginx/snippets/milanko-api-proxy.conf;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8011/;
        include /etc/nginx/snippets/milanko-api-proxy.conf;
    }

    location = /app {
        proxy_pass http://127.0.0.1:8021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        error_page 502 503 504 = @frontend_placeholder_develop;
    }
    location /app/ {
        proxy_pass http://127.0.0.1:8021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        error_page 502 503 504 = @frontend_placeholder_develop;
    }
    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }
    location @frontend_placeholder_develop {
        root /srv/milanko/frontend/develop;
        try_files /index.html =404;
    }
}

